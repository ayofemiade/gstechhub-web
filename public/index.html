<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding and viewport configuration -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- SEO and content metadata -->
    <meta name="description" content="Zivan - Professional Creative Agency specializing in innovative design solutions and digital experiences" />
    <meta name="keywords" content="creative agency, design, digital marketing, web development" />
    <meta name="author" content="Zivan Creative Agency" />
    
    <!-- Open Graph tags for social media sharing -->
    <meta property="og:title" content="Zivan - Creative Agency" />
    <meta property="og:description" content="Professional Creative Agency specializing in innovative design solutions and digital experiences" />
    <meta property="og:type" content="website" />
    
    <!-- Favicon and Apple touch icons -->
    <link 
      rel="icon" 
      href="%PUBLIC_URL%/favicon.png"
      sizes="32x32"
      type="image/png"
    />
    <link 
      rel="apple-touch-icon" 
      href="%PUBLIC_URL%/favicon192.png"
    />
    
    <!-- Web app manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#ff5722" />
    
    <!-- Title -->
    <title>Zivan - Creative Agency | Innovative Digital Solutions</title>
    
    <!-- Preconnect to external domains if any -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" /> -->
    
    <!-- Critical CSS could be inlined here -->
    <style>
      /* Add critical CSS here */
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- Fallback for users with JavaScript disabled -->
    <noscript>
      <div style="padding: 20px; text-align: center;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to experience the full functionality of our website.</p>
      </div>
    </noscript>
    
    <!-- Main application root -->
    <div id="root"></div>
    
    <!-- Optional: Add loading state -->
    <div id="loader" style="display: none;">
      Loading...
    </div>
  </body>
</html>
